# Compila la web con Astro y la publica en GitHub Pages: en cada push a main, cuando el Vigía
# publica datos nuevos (lo lanza él) y cada noche con los datos de main, para que desaparezcan
# las convocatorias cuyo plazo ha vencido y cambien de estado las que abren.
# Requisito: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 23 * * *" # 00:05 en Madrid en invierno, 01:05 en verano
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Astro 7.4 exige Node ≥ 22.23.4; la 22 en caché del runner puede ser más antigua
          cache: npm
      - run: npm ci
      - name: Pruebas (importes con las mismas cifras que el original)
        run: npm test
      - run: npm run build
        env:
          # Mientras no haya dominio: variables del repo (Settings → Variables)
          #   SITE = https://<usuario>.github.io   BASE = /<nombre-del-repo>
          # Con dominio: SITE = https://es.ullswaterinvestments.com  BASE = /
          SITE: ${{ vars.SITE }}
          BASE: ${{ vars.BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
