# Agente Vigía. Cada día:
#  1. rehace el inventario de la web inglesa y comprueba sus enlaces externos,
#  2. descarga los datos de convocatorias (copia en data/convocatorias.json),
#  3. pasa las pruebas y compila la web con esos datos (el build valida cada campo),
#  4. compara los datos nuevos con los publicados (scripts/comparar-convocatorias.mjs).
#
# Si todo es normal, PUBLICA SOLO: commit en main y publicación en GitHub Pages. Así se decidió
# el 5 nov. 2026 para los datos oficiales de convocatorias, como hace la web de noticias.
# Si algo parece anómalo (caen de golpe más del 20 % de las convocatorias o desaparecen muchas
# que aún no han cerrado), NO publica: deja los datos en la rama vigia/actualizacion y abre un
# aviso para que una persona los revise. Los textos redactados por IA siguen necesitando
# aprobación humana.
name: Vigía de la web inglesa y las convocatorias

on:
  schedule:
    - cron: "17 5 * * *" # cada día, 05:17 UTC (06:17 en Madrid en invierno, 07:17 en verano)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # para lanzar la publicación (deploy.yml) después del commit

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Astro 7.4 exige Node ≥ 22.23.4; la 22 en caché del runner puede ser más antigua
          cache: npm
      - run: npm ci
      - name: Inventario de la web inglesa (visita los enlaces externos)
        run: npm run inventario:verificar
      - name: Datos de convocatorias
        run: npm run convocatorias
      - name: Pruebas (importes con las mismas cifras que el original)
        run: npm test
      - name: La web compila con los datos nuevos
        run: npm run build

      # La fecha del resumen del inventario cambia en cada ejecución: solo cuenta si cambia el contenido.
      - name: ¿Qué ha cambiado?
        id: cambios
        run: |
          if [ -n "$(git status --porcelain -- data/convocatorias.json data/inventario/paginas.csv data/inventario/enlaces.csv)" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$(git status --porcelain -- data/convocatorias.json)" ]; then
            echo "convocatorias=true" >> "$GITHUB_OUTPUT"
          else
            echo "convocatorias=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/comparar-convocatorias.mjs --resumen "$RUNNER_TEMP/cambios.md" --commit "$RUNNER_TEMP/commit.txt" --salida "$GITHUB_OUTPUT" > /dev/null
          cat "$RUNNER_TEMP/cambios.md" >> "$GITHUB_STEP_SUMMARY"

      # ---- Caso normal: se publica solo -------------------------------------------------------
      - name: Publicar los datos (commit en main)
        id: publicar
        if: steps.cambios.outputs.hay == 'true' && steps.cambios.outputs.anomalia == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -q -F "$RUNNER_TEMP/commit.txt"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "hecho=true" >> "$GITHUB_OUTPUT"
      # Un push hecho con el token de Actions no lanza otros workflows: la publicación se lanza a mano.
      - name: Publicar la web
        if: steps.publicar.outputs.hecho == 'true' && steps.cambios.outputs.convocatorias == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Retirar la rama y los avisos de revisión anteriores
        if: steps.cambios.outputs.anomalia == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin vigia/actualizacion > /dev/null; then
            AJENOS=$(gh api "repos/${{ github.repository }}/compare/main...vigia/actualizacion" \
              --jq '[.commits[] | select(.commit.committer.email != "41898282+github-actions[bot]@users.noreply.github.com")] | length')
            if [ "$AJENOS" = "0" ]; then
              for PR in $(gh pr list --head vigia/actualizacion --state open --json number --jq '.[].number'); do
                gh pr close "$PR" --comment "Ya no hace falta: los datos se publican automáticamente cuando pasan las comprobaciones."
              done
              git push -q origin --delete vigia/actualizacion
            else
              echo "::warning::La rama vigia/actualizacion tiene $AJENOS commit(s) de una persona: no se borra."
            fi
          fi
          for NUM in $(gh issue list --label vigia --state open --json number --jq '.[].number' 2> /dev/null); do
            gh issue close "$NUM" --comment "Ya no queda nada pendiente de revisar: los datos se han publicado automáticamente."
          done
      # Aviso permanente, sin bloquear nada: convocatorias publicadas con el título oficial en
      # inglés porque aún no tienen traducción, o importes con un formato desconocido.
      - name: Aviso de títulos pendientes de traducir
        if: steps.cambios.outputs.anomalia == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/revisar.mjs --informe "$RUNNER_TEMP/revision.md" > /dev/null
          gh label create traducir --color 1D76DB --description "Títulos de convocatorias pendientes de traducir" --force > /dev/null
          NUM=$(gh issue list --label traducir --state open --json number --jq '.[0].number // empty')
          if grep -q "^Nada pendiente" "$RUNNER_TEMP/revision.md"; then
            if [ -n "$NUM" ]; then gh issue close "$NUM" --comment "Todo traducido: ya no queda nada pendiente."; fi
          else
            {
              echo "Estas convocatorias ya están publicadas, con su título oficial en inglés hasta que se traduzcan. Para traducirlas, pedírselo a Claude Code: las añade a \`data/titulos-es.json\` siguiendo \`data/glosario-titulos.json\`. Este aviso se actualiza cada día y se cierra solo cuando no queda nada pendiente."
              echo
              cat "$RUNNER_TEMP/revision.md"
            } > "$RUNNER_TEMP/pendientes.md"
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file "$RUNNER_TEMP/pendientes.md"
            else
              gh issue create --title "Pendiente: títulos de convocatorias sin traducir" --label traducir --body-file "$RUNNER_TEMP/pendientes.md"
            fi
          fi

      # ---- Anomalía: no se publica; lo revisa una persona -----------------------------------
      - name: Texto del aviso (qué ha pasado + revisión automática)
        if: steps.cambios.outputs.anomalia == 'true'
        run: |
          cat "$RUNNER_TEMP/cambios.md" > "$RUNNER_TEMP/pr.md"
          cat >> "$RUNNER_TEMP/pr.md" <<'EOF'

          Los datos nuevos no se han publicado porque algo parece anómalo. Comprobar en el portal
          Funding & Tenders si los cambios son reales (por ejemplo, unas cuantas convocatorias que
          desaparecen) o un fallo del servicio de datos. Si son reales, hacer merge para publicarlos;
          si no, cerrar el PR y avisar a quien mantiene el servicio de datos.

          EOF
          node scripts/revisar.mjs --informe "$RUNNER_TEMP/revision.md" > /dev/null
          cat "$RUNNER_TEMP/revision.md" >> "$RUNNER_TEMP/pr.md"
      # create-pull-request rehace la rama desde main en cada ejecución: si una persona le ha
      # añadido commits, se perderían. En ese caso no se toca la rama hasta el merge.
      - name: ¿Ha editado alguien la rama del Vigía?
        id: rama
        if: steps.cambios.outputs.anomalia == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AJENOS=0
          if git ls-remote --exit-code --heads origin vigia/actualizacion > /dev/null; then
            AJENOS=$(gh api "repos/${{ github.repository }}/compare/main...vigia/actualizacion" \
              --jq '[.commits[] | select(.commit.committer.email != "41898282+github-actions[bot]@users.noreply.github.com")] | length')
          fi
          echo "ajenos=$AJENOS" >> "$GITHUB_OUTPUT"
          if [ "$AJENOS" != "0" ]; then
            echo "::warning::La rama vigia/actualizacion tiene $AJENOS commit(s) de una persona. El Vigía no la actualiza hasta que se haga merge del PR o se borre la rama."
          fi
      - name: Abrir o actualizar el Pull Request
        id: pr
        if: steps.cambios.outputs.anomalia == 'true' && steps.rama.outputs.ajenos == '0'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: vigia/actualizacion
          commit-message: "Vigía: datos de convocatorias pendientes de revisar"
          title: "Vigía: datos de convocatorias pendientes de revisar"
          body-path: ${{ runner.temp }}/pr.md
          add-paths: |
            data/
      # Si la organización no deja que GitHub Actions abra PR («Allow GitHub Actions to create
      # and approve pull requests», en los ajustes de la organización), los datos ya están en
      # la rama vigia/actualizacion: se avisa en un issue con el enlace para abrir el PR a mano.
      - name: Aviso en un issue si no se ha podido abrir el PR
        if: steps.cambios.outputs.anomalia == 'true' && steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code --heads origin vigia/actualizacion > /dev/null || { echo "::error::No se subió la rama vigia/actualizacion"; exit 1; }
          ENLACE="${{ github.server_url }}/${{ github.repository }}/compare/main...vigia/actualizacion?expand=1"
          {
            echo "El Vigía ha encontrado cambios anómalos y **no los ha publicado**. Están en la rama \`vigia/actualizacion\`."
            echo
            echo "**[Abrir el Pull Request]($ENLACE)**, revisarlo y hacer merge si los cambios son correctos. Este aviso se actualiza en cada ejecución mientras siga abierto."
            echo
            echo "---"
            echo
            cat "$RUNNER_TEMP/pr.md"
          } > "$RUNNER_TEMP/issue.md"
          gh label create vigia --color FBCA04 --description "Avisos del Vigía" --force > /dev/null
          NUM=$(gh issue list --label vigia --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Vigía: datos de convocatorias pendientes de revisar" --label vigia --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Cerrar el aviso si ya hay PR
        if: steps.pr.outcome == 'success' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for NUM in $(gh issue list --label vigia --state open --json number --jq '.[].number' 2> /dev/null); do
            gh issue close "$NUM" --comment "Los cambios están en el PR #${{ steps.pr.outputs.pull-request-number }}."
          done
